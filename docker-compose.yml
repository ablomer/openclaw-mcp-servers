# Root OpenClaw stack. Project compose fragments are included so they share
# networks with this file. Add another project with:
#   include:
#     - path: ./other-project/docker-compose.yml
include:
  - path: ./messages/docker-compose.yml
  - path: ./mood-journal/docker-compose.yml
  - path: ./gog/docker-compose.yml
  - path: ./google-health/docker-compose.yml
  - path: ./context/docker-compose.yml

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/openclaw/data:/home/node/.openclaw
    environment:
      - TZ=America/New_York
    networks:
      - proxy
      - messages-internal
      - mood-journal-internal
      - gog-internal
      - google-health-internal
      - context-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clawd.entrypoints=http"
      - "traefik.http.routers.clawd.rule=Host(`${OPENCLAW_HOST}`)"
      - "traefik.http.middlewares.clawd-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.clawd.middlewares=clawd-https-redirect"
      - "traefik.http.routers.clawd-secure.entrypoints=https"
      - "traefik.http.routers.clawd-secure.rule=Host(`${OPENCLAW_HOST}`)"
      - "traefik.http.routers.clawd-secure.tls=true"
      - "traefik.http.routers.clawd-secure.service=clawd"
      - "traefik.http.services.clawd.loadbalancer.server.port=18789"
      - "traefik.docker.network=proxy"
  gitwatch:
    image: ghcr.io/gitwatch/gitwatch:latest
    user: "1000:1000"
    environment:
      - GIT_WATCH_DIR=/app/watched-repo
      - GIT_REMOTE=origin
      - GIT_BRANCH=main
      - COMMIT_MSG=Auto-commit on change
      - COMMIT_ON_START=true
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ${DATA_DIR}/openclaw/data/workspace/vault:/app/watched-repo
      - ${DATA_DIR}/openclaw/ssh:/home/augusto/.ssh

networks:
  proxy:
    external: true
  messages-internal:
    external: true
    name: messages-internal
  mood-journal-internal:
    external: true
    name: mood-journal-internal
  gog-internal:
    external: true
    name: gog-internal
  google-health-internal:
    external: true
    name: google-health-internal
  context-internal:
    external: true
    name: context-internal
