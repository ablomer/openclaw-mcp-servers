# Context MCP. Included from the repo-root OpenClaw compose.
# No published ports. No Traefik labels.
# Network is created by deploy.sh:
#   docker network create --internal context-internal
#
# Joins messages-internal and gog-internal so it can call those MCP servers.
# OpenClaw (root docker-compose.yml) attaches to context-internal only.
# Does not mount the OpenClaw workspace.

services:
  context-mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      MESSAGES_MCP_URL: http://messages-mcp:3000/mcp
      CALENDAR_MCP_URL: http://calendar-mcp:3000/mcp
      EMAIL_MCP_URL: http://email-mcp:3000/mcp
      PORT: "3000"
      HOST: 0.0.0.0
      TZ: America/New_York
    networks:
      - context-internal
      - messages-internal
      - gog-internal
    pids_limit: 256
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  context-internal:
    external: true
    name: context-internal
  messages-internal:
    external: true
    name: messages-internal
  gog-internal:
    external: true
    name: gog-internal
